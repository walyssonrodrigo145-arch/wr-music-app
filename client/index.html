    <meta charset="UTF-8" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Fontes: antecipa conexão (o CSS do Google Fonts é importado pelo bundle) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MusicPro" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      html.dark #boot-loader {
        background: #070514;
      }
      #boot-loader .bl-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #boot-loader .bl-logo {
        width: 52px;
        height: 52px;
        animation: bl-pulse 1.6s ease-in-out infinite;
      }
      #boot-loader .bl-spin {
        width: 22px;
        height: 22px;
        border-radius: 9999px;
        border: 2.5px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6366f1;
        animation: bl-spin 0.8s linear infinite;
      }
      #boot-loader .bl-text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6366f1;
      }
      #boot-loader.bl-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes bl-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes bl-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var darkThemes = ["dark", "midnight", "purple", "grafite"];
          if (theme && darkThemes.indexOf(theme) !== -1) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TNCFL02S7R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TNCFL02S7R');
    </script>
    <script>
      // Desativa a API nativa BarcodeDetector pois em alguns Androids/Chromes (falta do Play Services)
      // ela existe, mas falha ao executar .detect() com 'Barcode detection service unavailable'
      // Ao forçar undefined, o react-qr-scanner automaticamente usa a versão polyfill via WASM (ZXing).
      window.BarcodeDetector = undefined;
    </script>
    <script>
      // Captura global do evento de instalação para o PWA
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        console.log('[PWA] Evento de instalação capturado com sucesso.');
        // Dispara um evento customizado para avisar as páginas que já estão abertas
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        console.log('[PWA] Aplicativo instalado com sucesso.');
      });
    </script>
  </head>

  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Carregando MusicPro">
      <div class="bl-box">
        <img class="bl-logo" src="/logo.svg" alt="" />
        <div class="bl-spin"></div>
        <span class="bl-text">Carregando…</span>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var el = document.getElementById("boot-loader");
        if (el && !el.classList.contains("bl-hide")) {
          el.classList.add("bl-hide");
          setTimeout(function () { el.remove(); }, 450);
        }
      }, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>

</html>
